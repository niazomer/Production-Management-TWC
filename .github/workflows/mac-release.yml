name: Release Mac App
on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'styles.css'
      - 'js/ui-*.js'
      - 'assets/**'
      # Backend changes outside these paths will not trigger a new release

jobs:
  build_mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - name: Build and Sign Mac App
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run make
